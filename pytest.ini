[pytest]
testpaths = tests
pythonpath = .

# Reporte HTML autocontenido (incluye las capturas) en cada ejecución
addopts = -v --html=reports/reporte.html --self-contained-html

# Marcadores para ejecutar grupos de tests (ej.: pytest -m api)
markers =
    ui: pruebas de interfaz con Selenium WebDriver
    api: pruebas de API con Requests
    smoke: pruebas rápidas de los flujos principales
    defectos: defectos conocidos del sitio (marcados como xfail)

# Logs de ejecución: en consola y en un archivo dentro de reports/
log_cli = true
log_cli_level = INFO
log_file = reports/ejecucion.log
log_file_mode = w
log_file_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
